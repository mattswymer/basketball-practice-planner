<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basketball Practice Planner & Companion</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="main-header">
      <div class="top-bar">
        <div class="team-selector-wrap">
          <label for="active-team-select"><strong>Team:</strong></label>
          <select id="active-team-select"></select>
          <button id="btn-manage-teams" class="btn btn-sm">Manage Teams & Rosters</button>
        </div>
        <div class="header-nav">
          <button id="btn-view-planner" class="btn btn-tab active">Planner & Live View</button>
          <button id="btn-view-analytics" class="btn btn-tab">Skill Analytics</button>
        </div>
      </div>

      <div class="practice-meta-bar">
        <div class="meta-field">
          <label for="practice-date">Date:</label>
          <input type="date" id="practice-date">
        </div>
        <div class="meta-field">
          <label for="practice-start-time">Start:</label>
          <input type="time" id="practice-start-time" value="18:00">
        </div>
        <div class="meta-field">
          <label for="practice-end-time">End:</label>
          <input type="time" id="practice-end-time" value="19:30">
        </div>
        <div class="meta-actions">
          <button id="btn-fit-practice" class="btn btn-secondary">Fit to Allotted Time</button>
          <button id="btn-equipment" class="btn btn-secondary">Master Equipment List</button>
          <button id="btn-grouping" class="btn btn-secondary">On-Court Grouping</button>
          <button id="btn-export-json" class="btn btn-outline">Export JSON</button>
          <button id="btn-import-json" class="btn btn-outline">Import JSON</button>
          <input type="file" id="input-import-file" accept=".json" style="display:none;">
          <button id="btn-export-pdf" class="btn btn-primary">Download One-Page PDF</button>
        </div>
      </div>
    </header>

    <main class="content-area">
      <!-- PLANNER & LIVE VIEW -->
      <section id="view-planner" class="view-panel active">
        <aside class="sidebar">
          <div class="sidebar-header">
            <h3>Drill Bank</h3>
            <button id="btn-new-bank-drill" class="btn btn-sm btn-primary">+ New Drill</button>
          </div>
          <div class="sidebar-filters">
            <input type="text" id="bank-search" placeholder="Search drills or equipment...">
            <select id="bank-tag-filter">
              <option value="">All Skill Tags</option>
            </select>
          </div>
          <div id="bank-list" class="drill-list"></div>
        </aside>

        <section class="schedule-container">
          <div class="live-control-bar">
            <div class="live-status">
              <span id="live-indicator" class="status-dot"></span>
              <strong id="live-status-text">Practice Offline</strong>
            </div>
            <div id="live-timer-readout" class="live-timer">--:--</div>
            <div class="live-btn-group">
              <button id="btn-start-practice" class="btn btn-success">Start Live Practice</button>
              <button id="btn-prev-drill" class="btn btn-sm" disabled>◄ Prev Drill</button>
              <button id="btn-next-drill" class="btn btn-sm" disabled>Next Drill ►</button>
              <button id="btn-stop-practice" class="btn btn-danger btn-sm" style="display:none;">End Practice</button>
            </div>
          </div>

          <div id="time-summary-banner" class="summary-banner"></div>

          <div id="schedule-board" class="schedule-board"></div>

          <div class="add-station-wrap">
            <button id="btn-add-station-block" class="btn btn-outline">+ Add Station Rotation Block</button>
          </div>
        </section>
      </section>

      <!-- ANALYTICS VIEW -->
      <section id="view-analytics" class="view-panel">
        <div class="analytics-grid">
          <div class="chart-card">
            <h3>Skill Focus Distribution (Planned Minutes)</h3>
            <canvas id="skillRadarChart"></canvas>
          </div>
          <div class="chart-card">
            <h3>Drill Usage Frequency</h3>
            <canvas id="drillBarChart"></canvas>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- MODALS -->
  <!-- Edit Scheduled Item Modal -->
  <dialog id="dialog-edit-item" class="app-dialog">
    <form id="form-edit-item" class="dialog-form">
      <h3 id="edit-dialog-title">Edit Drill</h3>
      <input type="hidden" id="edit-item-id">
      
      <div class="form-group">
        <label for="edit-item-name">Drill Name:</label>
        <input type="text" id="edit-item-name" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="edit-item-duration">Duration (mins):</label>
          <input type="number" id="edit-item-duration" min="1" max="120" required>
        </div>
        <div class="form-group">
          <label for="edit-item-equipment">Equipment Needed:</label>
          <input type="text" id="edit-item-equipment" placeholder="e.g. 2 basketballs, 4 cones">
        </div>
      </div>

      <div class="form-group">
        <label>Skill Tags:</label>
        <div id="edit-item-tags" class="tag-checkbox-grid"></div>
      </div>

      <div class="form-group">
        <label for="edit-item-notes">Drill Cues & Instructions:</label>
        <textarea id="edit-item-notes" rows="4"></textarea>
      </div>

      <div class="dialog-actions">
        <button type="button" id="btn-remove-scheduled" class="btn btn-danger">Remove from Schedule</button>
        <button type="button" id="btn-update-bank-default" class="btn btn-secondary">Update Bank Default</button>
        <div class="spacer"></div>
        <button type="button" id="btn-cancel-edit" class="btn btn-outline">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </dialog>

  <!-- Team & Roster Modal -->
  <dialog id="dialog-teams" class="app-dialog">
    <div class="dialog-content">
      <h3>Manage Teams & Rosters</h3>
      <div class="form-row">
        <input type="text" id="new-team-name" placeholder="New Team Name">
        <button id="btn-add-team" class="btn btn-primary">+ Add Team</button>
      </div>
      <hr>
      <div class="form-group">
        <label for="roster-team-select">Select Team to Edit Roster:</label>
        <select id="roster-team-select"></select>
      </div>
      <div class="form-group">
        <label>Player Roster (One per line: # Name):</label>
        <textarea id="team-roster-input" rows="8" placeholder="10 Jordan Smith&#10;12 Alex Johnson"></textarea>
      </div>
      <div class="dialog-actions">
        <button id="btn-save-roster" class="btn btn-primary">Save Roster</button>
        <button id="btn-close-teams" class="btn btn-outline">Close</button>
      </div>
    </div>
  </dialog>

  <!-- Grouping Modal -->
  <dialog id="dialog-grouping" class="app-dialog">
    <div class="dialog-content">
      <h3>On-Court Player Grouping Generator</h3>
      <div class="form-row">
        <label>Split present players into:</label>
        <select id="group-count-select">
          <option value="2">2 Groups</option>
          <option value="3">3 Groups</option>
          <option value="4">4 Groups</option>
        </select>
        <button id="btn-generate-groups" class="btn btn-primary">Randomize Groups</button>
      </div>
      <div id="groups-output-container" class="groups-grid"></div>
      <div class="dialog-actions">
        <button id="btn-close-grouping" class="btn btn-outline">Close</button>
      </div>
    </div>
  </dialog>

  <!-- Master Equipment Modal -->
  <dialog id="dialog-equipment" class="app-dialog">
    <div class="dialog-content">
      <h3>Master Equipment List for Session</h3>
      <p class="subtext">Aggregated items required for today's practice:</p>
      <div id="equipment-master-list" class="equipment-checklist"></div>
      <div class="dialog-actions">
        <button id="btn-close-equipment" class="btn btn-primary">Done</button>
      </div>
    </div>
  </dialog>

  <script src="js/drills-db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
